name: "Channel 1 - Daily Upload (23:00 UTC / 7 PM ET)"

on:
  schedule:
    - cron: "0 23 * * *"       # 23:00 UTC daily = 7:00 PM US Eastern (US evening prime); 4:30 AM IST
  workflow_dispatch:
    inputs:
      channel:
        description: "channel id"
        required: false
        default: "channel_1"
      dry_run:
        description: "true = list+pick only, never upload"
        required: false
        default: "false"
      force:
        description: "true = ignore the per-day guard (post a second one today)"
        required: false
        default: "false"

# The per-day guard (runs table) makes re-triggers on the same UTC day a no-op,
# so a delayed cron run + a manual dispatch cannot double-post.

concurrency:
  group: upload-channel_1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already present"; ffmpeg -version | head -1; exit 0
          fi
          echo "installing ffmpeg via apt"
          timeout 120 sudo apt-get update -y || true
          timeout 180 sudo apt-get install -y ffmpeg || true
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi

          echo "apt failed; trying static build mirror 1 (johnvansickle)"
          if timeout 90 curl -fL --retry 2 --retry-max-time 80 --connect-timeout 15 \
              -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 || true
            sudo install /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/ 2>/dev/null || true
          fi
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi

          echo "mirror 1 unreachable; trying static build mirror 2 (BtbN GitHub release)"
          URL=$(timeout 20 curl -fsSL --connect-timeout 15 \
            https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest \
            | grep -oE '"browser_download_url":[[:space:]]*"[^"]*linux64-gpl\.tar\.xz"' \
            | head -1 | cut -d'"' -f4)
          if [ -n "$URL" ] && timeout 90 curl -fL --retry 2 --retry-max-time 80 --connect-timeout 15 \
              -o /tmp/ff2.tar.xz "$URL"; then
            mkdir -p /tmp/ff2 && tar -xJf /tmp/ff2.tar.xz -C /tmp/ff2 || true
            BIN=$(find /tmp/ff2 -type d -name bin | head -1)
            [ -n "$BIN" ] && sudo install "$BIN/ffmpeg" "$BIN/ffprobe" /usr/local/bin/ 2>/dev/null || true
          fi
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -1; exit 0; fi

          echo "::error::ffmpeg install failed via apt + both static mirrors"
          exit 1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets to files
        env:
          CH_CLIENT_SECRET: ${{ secrets.CHANNEL_1_CLIENT_SECRET }}
          CH_TOKEN: ${{ secrets.CHANNEL_1_TOKEN }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          mkdir -p credentials tokens
          printf '%s' "$CH_CLIENT_SECRET" | base64 -d > credentials/channel_1_client_secret.json
          printf '%s' "$CH_TOKEN"         | base64 -d > tokens/channel_1_token.json
          if [ -n "$TIKTOK_COOKIES" ]; then
            printf '%s' "$TIKTOK_COOKIES" | base64 -d > cookies.txt
            echo "TIKTOK_COOKIES_FILE=$PWD/cookies.txt" >> "$GITHUB_ENV"
          fi
          python -c "import json;json.load(open('credentials/channel_1_client_secret.json'));json.load(open('tokens/channel_1_token.json'));print('secret files OK')"

      - name: Write .env
        run: |
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" > .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "DRY_RUN=${{ github.event.inputs.dry_run }}" >> .env

      - name: Run slot 1
        run: |
          ARGS="--slot 1 --channel ${{ github.event.inputs.channel || 'channel_1' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python run.py $ARGS

      - name: Commit DB
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python -c "import sqlite3;c=sqlite3.connect('data/channel_1.db');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/channel_1.db
          git commit -m "state: slot 1 run $(date -u +%FT%TZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"; sleep 5
          done
          echo "could not push DB after 3 tries"; exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot1-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
